<style>
:root {
--bg:#000000;
--text:#ffffff;
--muted:#888888;
--border:#202020;
}

* {
box-sizing:border-box;
}

body {
margin:0;
background:var(--bg);
color:var(--text);
font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
padding-bottom: 80px;
}

/* MAIN CONTAINER */
.container {
max-width:900px;
margin:auto;
padding:60px 25px;
}

/* HEADER SECTION (Title & Back Button) */
.header-section {
display: flex;
align-items: center;
justify-content: space-between;
gap: 20px;
margin-bottom: 60px;
}

.header-title {
font-size: 42px;
font-weight: 700;
letter-spacing: -2px;
margin: 0;
color: var(--text);
text-decoration: none;
cursor: pointer;
transition: opacity 0.2s;
white-space: nowrap;
}

.header-title:hover {
opacity: 0.8;
}

/* BACK LINK (In-line with header title on all screens) */
.back {
color:var(--muted);
cursor:pointer;
display:inline-block;
font-family: "IBM Plex Mono", monospace;
font-size:14px;
text-decoration:none;
white-space: nowrap;
}

.back:hover {
color:var(--text);
}

/* POST HEADER WITH DIVIDER */
.post-header {
margin-bottom:40px;
}

.post-title {
font-size:48px;
letter-spacing:-2px;
line-height:1.1;
margin:0 0 15px 0;
}

.post-meta {
font-size:14px;
color:var(--muted);
font-family: "IBM Plex Mono", monospace;
margin-bottom:30px;
}

.divider {
width:100%;
height:1px;
background:var(--border);
margin-top:20px;
}

/* BODY CONTENT */
.post-body p,
.post-body li {
font-size:18px;
line-height:1.8;
color:var(--text);
}

.post-body img {
max-width:100%;
border-radius:14px;
border: 2px solid #ffffff;
margin:20px 0 6px 0;
display: block;
}

/* FIXED FOOTER */
footer {
position: fixed;
bottom: 0;
left: 0;
width: 100%;
height: 60px;
z-index: 20;
background: rgba(0,0,0,.85);
backdrop-filter: blur(14px);
border-top:1px solid var(--border);
display:flex;
justify-content:space-between;
align-items:center;
padding: 0 30px;
color:var(--muted);
font-size:14px;
}

.footer-links {
display:flex;
gap:20px;
}

.footer-links a {
color:var(--muted);
text-decoration:none;
transition:color 0.2s;
}

.footer-links a:hover {
color:var(--text);
}

@media(max-width:700px){
.header-title {
font-size: 32px;
}
.container {
padding:40px 20px;
}
.post-title {
font-size:36px;
}
footer {
height: auto;
flex-direction: column;
gap: 6px;
align-items: center;
text-align: center;
padding: 12px 15px;
}
}
</style>
</head>
