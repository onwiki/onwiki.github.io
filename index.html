<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>onwiki</title>
<meta name="description" content="Notes, projects, experiments and things I've learned.">

<!-- Open Graph / Social Sharing -->
<meta property="og:title" content="O.N Track">
<meta property="og:description" content="Notes, projects, experiments and things I've learned.">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
:root {
--bg: #000000;
--text: #ffffff;
--muted: #888888;
--border: #202020;
}

* {
box-sizing: border-box;
}

body {
margin: 0;
background: var(--bg);
color: var(--text);
font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
padding-bottom: 80px;
}

.container {
max-width: 900px;
margin: auto;
padding: 60px 25px;
}

/* HEADER SECTION */
.header-section {
display: flex;
align-items: center;
justify-content: space-between;
gap: 20px;
margin-bottom: 25px;
flex-wrap: wrap;
}

.header-title {
font-size: 42px;
font-weight: 700;
letter-spacing: -2px;
margin: 0;
color: var(--text);
text-decoration: none;
cursor: pointer;
transition: opacity 0.2s;
}

.header-title:hover {
opacity: 0.8;
}

/* SEARCH */
.search-box {
height: 36px;
display: flex;
align-items: center;
gap: 10px;
padding: 0 12px;
border: 1px solid var(--border);
border-radius: 8px;
color: var(--muted);
background: var(--bg);
}

.search-box input {
background: none;
border: none;
outline: none;
color: var(--text);
width: 170px;
font-size: 14px;
}

.search-box input::placeholder {
color: var(--muted);
}

.shortcut {
font-size: 12px;
border: 1px solid var(--border);
padding: 3px 7px;
border-radius: 5px;
font-family: "IBM Plex Mono", monospace;
}

.intro {
margin-bottom: 40px;
}

.intro p {
color: var(--muted);
font-size: 18px;
line-height: 1.6;
margin: 0;
}

/* SECTION HEADINGS */
.section-heading {
font-size: 14px;
font-family: "IBM Plex Mono", monospace;
color: var(--muted);
text-transform: uppercase;
letter-spacing: 1px;
margin-bottom: 20px;
display: flex;
align-items: center;
gap: 8px;
}

/* POST LIST ITEM */
.post-item {
display: flex;
align-items: center;
gap: 20px;
margin-bottom: 30px;
padding-bottom: 20px;
border-bottom: 1px solid var(--border);
}

.post-item:last-child {
border-bottom: none;
}

.post-thumb {
width: 110px;
height: 75px;
object-fit: cover;
border-radius: 10px;
flex-shrink: 0;
display: block;
border: 1px solid var(--border);
}

.post-info {
flex-grow: 1;
}

.post-link {
font-size: 22px;
font-weight: 500;
color: var(--text);
text-decoration: underline;
cursor: pointer;
letter-spacing: -.5px;
display: inline-block;
margin-bottom: 6px;
}

.post-link:hover {
opacity: .7;
}

/* Highlight style for search matching */
.highlight {
background-color: var(--text);
color: var(--bg);
padding: 0 2px;
border-radius: 2px;
}

.post-meta {
font-size: 13px;
color: var(--muted);
font-family: "IBM Plex Mono", monospace;
}

.no-results {
color: var(--muted);
font-size: 16px;
font-family: "IBM Plex Mono", monospace;
padding: 20px 0;
}

#pinned-section {
margin-bottom: 45px;
}

/* FIXED FOOTER */
footer {
position: fixed;
bottom: 0;
left: 0;
width: 100%;
height: 60px;
z-index: 20;
background: rgba(0,0,0,.85);
backdrop-filter: blur(14px);
border-top: 1px solid var(--border);
display: flex;
justify-content: space-between;
align-items: center;
padding: 0 30px;
color: var(--muted);
font-size: 14px;
}

.footer-links {
display: flex;
gap: 20px;
}

.footer-links a {
color: var(--muted);
text-decoration: none;
transition: color 0.2s;
}

.footer-links a:hover {
color: var(--text);
}

@media(max-width: 700px) {
.header-section {
flex-direction: column;
align-items: flex-start;
gap: 15px;
}
.search-box {
width: 100%;
}
.search-box input {
width: 100%;
}
.shortcut {
display: none;
}
.container {
padding: 40px 20px;
}
.post-thumb {
width: 45px;
height: 65px;
object-position: left;
border-top-left-radius: 10px;
border-bottom-left-radius: 10px;
border-top-right-radius: 0;
border-bottom-right-radius: 0;
border-right: none;
}
footer {
height: auto;
flex-direction: column;
gap: 6px;
align-items: center;
text-align: center;
padding: 12px 15px;
}
}
</style>
</head>

<body>

<div class="container">

<div class="header-section">
<a href="index.html" class="header-title">OnWiki Journal</a>
<div class="search-box" id="searchBox">
<svg width="15" height="15" viewBox="0 0 24 24">
<circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/>
<line x1="16" y1="16" x2="22" y2="22" stroke="currentColor" stroke-width="2"/>
</svg>
<input id="search" placeholder="Search notes..." oninput="filterPosts()">
<span class="shortcut" id="shortcut">⌘ K</span>
</div>
</div>

<section class="intro">
<p>Notes, projects, experiments, and things I've learned.</p>
</section>

<!-- PINNED POST SECTION -->
<section id="pinned-section">
<div class="section-heading">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-.89 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"></path></svg>
Pinned Post
</div>
<div id="pinned-post"></div>
</section>

<!-- LATEST POSTS SECTION -->
<section id="home">
<div class="section-heading">Latest Posts</div>
<div id="posts"></div>
</section>

</div>

<footer>
<div>A collection of thoughts and ideas by O.N.</div>
<div class="footer-links">
<a href="index.html">Home</a>
<a href="mailto:oscarxdev@gmail.com">oscarxdev@gmail.com</a>
</div>
</footer>

<script>
// CUSTOMIZE YOUR PINNED POST DIRECTLY HERE
const pinnedPost = {
file: "posts/about.html",
title: "About this Journal",
date: "2026-08-05",
image: "images/about.jpg"
};

// ADD NEW POSTS HERE
const posts = [
{
file: "posts/deamazon.html",
title: "DeAmazoning - I hacked my Kindle, Alexa, and soon Firestick",
date: "2026-01-31",
image: "images/deamazon.png"
},
{
file: "posts/cyberdeck.html",
title: "Building a Cyberdeck + TailsOS",
date: "2025-03-26",
image: "images/cyberdeck.png"
},
{
file: "posts/notes-on-3p.html",
title: "Notes on Pollution, the Planet, and the Human Population",
date: "2024-11-08",
image: "images/climate-flux.jpg"
},
{
file: "posts/the-VPs.html",
title: "The VP's (Five P's to Fear Death)",
date: "2024-10-11 20:44",
image: "images/moa.jpg"
}
];

function escapeRegExp(string) {
return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function renderPinnedPost() {
const pinnedArea = document.getElementById("pinned-post");

if (!pinnedPost || !pinnedPost.file) {
document.getElementById("pinned-section").style.display = "none";
return;
}

pinnedArea.innerHTML = `
<div class="post-item" style="margin-bottom: 0; padding-bottom: 0; border-bottom: none;">
<img class="post-thumb" src="${pinnedPost.image}" alt="">
<div class="post-info">
<a class="post-link" href="${pinnedPost.file}">${pinnedPost.title}</a>
<div class="post-meta">Published on ${pinnedPost.date} by Oscar N.</div>
</div>
</div>
`;
}

function renderPosts(items, query = "") {
const area = document.getElementById("posts");
area.innerHTML = "";

if (items.length === 0) {
area.innerHTML = '<div class="no-results">No notes found matching your search.</div>';
return;
}

for (const post of items) {
let item = document.createElement("div");
item.className = "post-item";

let displayTitle = post.title;
let displayDate = post.date;

if (query.length > 0) {
const regex = new RegExp(`(${escapeRegExp(query)})`, 'gi');
displayTitle = post.title.replace(regex, '<span class="highlight">$1</span>');
displayDate = post.date.replace(regex, '<span class="highlight">$1</span>');
}

item.innerHTML = `
<img class="post-thumb" src="${post.image}" alt="">
<div class="post-info">
<a class="post-link" href="${post.file}">${displayTitle}</a>
<div class="post-meta">Published on ${displayDate} by Oscar N.</div>
</div>
`;

area.appendChild(item);
}
}

function filterPosts() {
const query = document.getElementById("search").value.trim();
const lowerQuery = query.toLowerCase();

const filtered = posts.filter(post => {
const matchesTitle = post.title.toLowerCase().includes(lowerQuery);
const matchesDate = post.date.toLowerCase().includes(lowerQuery);
return matchesTitle || matchesDate;
});

renderPosts(filtered, query);
}

const search = document.getElementById("search");
document.addEventListener("keydown", e => {
if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() == "k") {
e.preventDefault();
search.focus();
}
});

if (!navigator.userAgent.includes("Mac")) {
document.getElementById("shortcut").innerText = "Ctrl K";
}

renderPinnedPost();
renderPosts(posts);
</script>

</body>
</html>
