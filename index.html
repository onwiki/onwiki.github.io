<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>onwiki</title>
<meta name="description" content="Notes, projects, experiments and things I've learned.">

<meta property="og:title" content="O.N Track">
<meta property="og:description" content="Notes, projects, experiments and things I've learned.">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
:root {
--bg: #000000;
--text: #ffffff;
--muted: #888888;
--border: #202020;
}

* {
box-sizing: border-box;
}

body {
margin: 0;
background: var(--bg);
color: var(--text);
font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
padding-bottom: 80px;
}

.container {
max-width: 900px;
margin: auto;
padding: 60px 25px;
transition: max-width 0.3s ease;
}

.container.collage-expanded {
max-width: 1200px;
}

.header-section {
display: flex;
align-items: center;
justify-content: space-between;
gap: 20px;
margin-bottom: 25px;
flex-wrap: wrap;
}

.header-right {
display: flex;
align-items: center;
gap: 10px;
}

.header-title {
font-size: 42px;
font-weight: 700;
letter-spacing: -2px;
margin: 0;
color: var(--text);
text-decoration: none;
cursor: pointer;
transition: opacity 0.2s;
}

.header-title:hover {
opacity: 0.8;
}

.search-box {
height: 36px;
display: flex;
align-items: center;
gap: 10px;
padding: 0 12px;
border: 1px solid var(--border);
border-radius: 8px;
color: var(--muted);
background: var(--bg);
}

.search-box input {
background: none;
border: none;
outline: none;
color: var(--text);
width: 170px;
font-size: 14px;
}

.search-box input::placeholder {
color: var(--muted);
}

.collage-icon-btn {
height: 36px;
padding: 0 12px;
border: 1px solid var(--border);
border-radius: 8px;
color: var(--muted);
background: var(--bg);
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
transition: color 0.2s, border-color 0.2s;
}

.collage-icon-btn:hover {
color: var(--text);
border-color: var(--text);
}

.shortcut {
font-size: 12px;
border: 1px solid var(--border);
padding: 3px 7px;
border-radius: 5px;
font-family: "IBM Plex Mono", monospace;
}

.intro {
margin-bottom: 40px;
}

.intro p {
color: var(--muted);
font-size: 18px;
line-height: 1.6;
margin: 0;
}

.section-heading {
font-size: 14px;
font-family: "IBM Plex Mono", monospace;
color: var(--muted);
text-transform: uppercase;
letter-spacing: 1px;
margin-bottom: 20px;
display: flex;
align-items: center;
gap: 8px;
}
  
.post-item {
display: flex;
align-items: center;
gap: 20px;
margin-bottom: 30px;
padding-bottom: 20px;
border-bottom: 1px solid var(--border);
}

.post-item:last-child {
border-bottom: none;
}

.post-thumb {
width: 110px;
height: 75px;
object-fit: cover;
border-radius: 10px;
flex-shrink: 0;
display: block;
border: 1px solid var(--border);
}

.post-info {
flex-grow: 1;
}

.post-link {
font-size: 22px;
font-weight: 500;
color: var(--text);
text-decoration: underline;
cursor: pointer;
letter-spacing: -.5px;
display: inline-block;
margin-bottom: 6px;
}

.post-link:hover {
opacity: .7;
}
  
.highlight {
background-color: var(--text);
color: var(--bg);
padding: 0 2px;
border-radius: 2px;
}

.post-meta {
font-size: 13px;
color: var(--muted);
font-family: "IBM Plex Mono", monospace;
}

.no-results {
color: var(--muted);
font-size: 16px;
font-family: "IBM Plex Mono", monospace;
padding: 20px 0;
}

#pinned-section {
margin-bottom: 45px;
}

.pinterest-grid {
column-count: 4;
column-gap: 16px;
width: 100%;
}

@media(max-width: 1100px) {
.pinterest-grid { column-count: 3; }
}

@media(max-width: 800px) {
.pinterest-grid { column-count: 2; }
}

.collage-item {
break-inside: avoid;
margin-bottom: 16px;
position: relative;
border-radius: 16px;
overflow: hidden;
cursor: pointer;
background: var(--bg);
border: 1px solid var(--border);
}

.collage-item img {
width: 100%;
height: auto;
display: block;
border-radius: 16px;
transition: transform 0.3s ease, opacity 0.3s ease;
}

@media(max-width: 800px) {
.collage-item img {
aspect-ratio: 1 / 1;
object-fit: cover;
}
}

.collage-overlay {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: rgba(0, 0, 0, 0.85);
color: #fff;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
padding: 20px;
text-align: center;
opacity: 0;
transition: opacity 0.3s ease;
border-radius: 16px;
box-sizing: border-box;
font-size: 13px;
font-family: "IBM Plex Mono", monospace;
}

.collage-item:hover .collage-overlay,
.collage-item.touch-active .collage-overlay {
opacity: 1;
}

.collage-item:hover img,
.collage-item.touch-active img {
transform: scale(1.03);
opacity: 0.3;
}

footer {
position: fixed;
bottom: 0;
left: 0;
width: 100%;
height: 60px;
z-index: 20;
background: rgba(0,0,0,.85);
backdrop-filter: blur(14px);
border-top: 1px solid var(--border);
display: flex;
justify-content: space-between;
align-items: center;
padding: 0 30px;
color: var(--muted);
font-size: 14px;
}

.footer-links {
display: flex;
gap: 20px;
}

.footer-links a {
color: var(--muted);
text-decoration: none;
transition: color 0.2s;
}

.footer-links a:hover {
color: var(--text);
}

@media(max-width: 700px) {
.header-section {
flex-direction: column;
align-items: flex-start;
gap: 15px;
}
.header-right {
width: 100%;
}
.search-box {
flex-grow: 1;
}
.search-box input {
width: 100%;
}
.shortcut {
display: none;
}
.container {
padding: 40px 20px;
}
.post-thumb {
width: 45px;
height: 65px;
object-position: left;
border-top-left-radius: 10px;
border-bottom-left-radius: 10px;
border-top-right-radius: 0;
border-bottom-right-radius: 0;
border-right: none;
}
footer {
height: auto;
flex-direction: column;
gap: 6px;
align-items: center;
text-align: center;
padding: 12px 15px;
}
}
</style>
</head>

<body>

<div class="container" id="main-container">

<div class="header-section">
<a href="index.html" class="header-title">OnWiki Journal</a>
<div class="header-right">
<button id="collage-toggle-btn" class="collage-icon-btn" title="Toggle Visual Collage" aria-label="Toggle Visual Collage">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<rect x="3" y="3" width="7" height="7"></rect>
<rect x="14" y="3" width="7" height="7"></rect>
<rect x="14" y="14" width="7" height="7"></rect>
<rect x="3" y="14" width="7" height="7"></rect>
</svg>
</button>
<div class="search-box" id="searchBox">
<svg width="15" height="15" viewBox="0 0 24 24">
<circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/>
<line x1="16" y1="16" x2="22" y2="22" stroke="currentColor" stroke-width="2"/>
</svg>
<input id="search" placeholder="Search notes..." oninput="handleSearch()">
<span class="shortcut" id="shortcut">⌘ K</span>
</div>
</div>
</div>

<section class="intro">
<p>Notes, projects, experiments, and things I've learned.</p>
</section>

<!-- normal content -->
<div id="normal-content">
<section id="pinned-section">
<div class="section-heading">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-.89 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"></path></svg>
Pinned Post
</div>
<div id="pinned-post"></div>
</section>

<section id="home">
<div class="section-heading">Latest Posts</div>
<div id="posts"></div>
</section>
</div>

<!-- collage view -->
<div id="collage-view" style="display: none;">
<div class="section-heading">Visual Collage</div>
<div id="pinterest-grid" class="pinterest-grid"></div>
</div>

</div>

<footer>
<div>A collection of thoughts and ideas by O.N.</div>
<div class="footer-links">
<a href="index.html">Home</a>
<a href="mailto:oscarxdev@gmail.com">oscarxdev@gmail.com</a>
</div>
</footer>

<script>

const pinnedPost = {
file: "posts/about.html",
title: "About this Journal",
date: "2026-08-05",
image: "images/about.jpg"
};

const posts = [
{
file: "posts/surveillance.html",
title: "The Normalisation of Surveillance Tech",
date: "2026-08-08",
image: "images/surveillance.jpg"
},
{
file: "posts/deamazon.html",
title: "DeAmazoning - I hacked my Kindle, Alexa, and soon Firestick",
date: "2026-01-31",
image: "images/deamazon.png"
},
{
file: "posts/cyberdeck.html",
title: "Building a Cyberdeck + TailsOS",
date: "2025-03-26",
image: "images/cyberdeck.png"
},
{
file: "posts/thoughts-on-3p.html",
title: "Notes on Pollution, the Planet, and the Human Population",
date: "2024-11-08",
image: "images/3p.png"
},
{
file: "posts/the-VPs.html",
title: "The VP's (Five P's to Fear Death)",
date: "2024-10-11 20:44",
image: "images/moa.jpg"
}
];

const collageImages = [
{
url: "images/about.jpg",
caption: "About this Journal - Setup snapshot"
},
{
url: "images/surveillance.jpg",
caption: "Surveillance Tech notes reference"
},
{
url: "images/cyberdeck.png",
caption: "Cyberdeck build configuration & design"
},
{
url: "images/deamazon.png",
caption: "DeAmazoning hardware layout"
},
{
url: "images/3p.png",
caption: "Planet & Population Data Notes"
},
{
url: "images/moa.jpg",
caption: "Archive field view"
}
];

function escapeRegExp(string) {
return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function renderPinnedPost() {
const pinnedArea = document.getElementById("pinned-post");

if (!pinnedPost || !pinnedPost.file) {
document.getElementById("pinned-section").style.display = "none";
return;
}

pinnedArea.innerHTML = `
<div class="post-item" style="margin-bottom: 0; padding-bottom: 0; border-bottom: none;">
<img class="post-thumb" src="${pinnedPost.image}" alt="">
<div class="post-info">
<a class="post-link" href="${pinnedPost.file}">${pinnedPost.title}</a>
<div class="post-meta">Published on ${pinnedPost.date} by Oscar N.</div>
</div>
</div>
`;
}

function renderPosts(items, query = "") {
const area = document.getElementById("posts");
area.innerHTML = "";

if (items.length === 0) {
area.innerHTML = '<div class="no-results">No notes found matching your search.</div>';
return;
}

for (const post of items) {
let item = document.createElement("div");
item.className = "post-item";

let displayTitle = post.title;
let displayDate = post.date;

if (query.length > 0) {
const regex = new RegExp(`(${escapeRegExp(query)})`, 'gi');
displayTitle = post.title.replace(regex, '<span class="highlight">$1</span>');
displayDate = post.date.replace(regex, '<span class="highlight">$1</span>');
}

item.innerHTML = `
<img class="post-thumb" src="${post.image}" alt="">
<div class="post-info">
<a class="post-link" href="${post.file}">${displayTitle}</a>
<div class="post-meta">Published on ${displayDate} by Oscar N.</div>
</div>
`;

area.appendChild(item);
}
}

// render collage
function renderCollage(filteredImages = collageImages, query = "") {
const gridContainer = document.getElementById("pinterest-grid");
if (!gridContainer) return;

if (filteredImages.length === 0) {
gridContainer.innerHTML = '<div class="no-results">No collage images found matching your search.</div>';
return;
}

gridContainer.innerHTML = filteredImages.map(item => {
let displayCaption = item.caption;
if (query.length > 0) {
const regex = new RegExp(`(${escapeRegExp(query)})`, 'gi');
displayCaption = item.caption.replace(regex, '<span class="highlight">$1</span>');
}

return `
<div class="collage-item">
<img src="${item.url}" alt="${item.caption}" loading="lazy">
<div class="collage-overlay">
<p>${displayCaption}</p>
</div>
</div>
`;
}).join("");

const items = document.querySelectorAll(".collage-item");
items.forEach(item => {
item.addEventListener("touchstart", function(e) {
if (!this.classList.contains("touch-active")) {
e.preventDefault();
items.forEach(i => i.classList.remove("touch-active"));
this.classList.add("touch-active");
}
});
});
}

function handleSearch() {
const query = document.getElementById("search").value.trim();
const lowerQuery = query.toLowerCase();

if (isCollageActive) {
const filteredCollage = collageImages.filter(img => img.caption.toLowerCase().includes(lowerQuery));
renderCollage(filteredCollage, query);
} else {
const filteredPosts = posts.filter(post => {
const matchesTitle = post.title.toLowerCase().includes(lowerQuery);
const matchesDate = post.date.toLowerCase().includes(lowerQuery);
return matchesTitle || matchesDate;
});
renderPosts(filteredPosts, query);
}
}

// toggle view
const normalContent = document.getElementById("normal-content");
const collageView = document.getElementById("collage-view");
const mainContainer = document.getElementById("main-container");
const toggleBtn = document.getElementById("collage-toggle-btn");
const searchInput = document.getElementById("search");

let isCollageActive = false;

toggleBtn?.addEventListener("click", () => {
isCollageActive = !isCollageActive;
searchInput.value = "";

if (isCollageActive) {
normalContent.style.display = "none";
collageView.style.display = "block";
mainContainer.classList.add("collage-expanded");
toggleBtn.style.color = "var(--text)";
toggleBtn.style.borderColor = "var(--text)";
renderCollage();
} else {
collageView.style.display = "none";
normalContent.style.display = "block";
mainContainer.classList.remove("collage-expanded");
toggleBtn.style.color = "var(--muted)";
toggleBtn.style.borderColor = "var(--border)";
renderPosts(posts);
}
});

document.addEventListener("keydown", e => {
if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() == "k") {
e.preventDefault();
searchInput.focus();
}
if (e.key === "Escape" && isCollageActive) {
toggleBtn.click();
}
});

if (!navigator.userAgent.includes("Mac")) {
document.getElementById("shortcut").innerText = "Ctrl K";
}

renderPinnedPost();
renderPosts(posts);
renderCollage();
</script>

</body>
</html>
